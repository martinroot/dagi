[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dagi-core"
version = "0.7.0"
description = "A minimal Hermes-inspired terminal agent core"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "openai==2.24.0",
    "pymunk==7.2.0",
    "python-quickjs-ng==0.12.1.1",
]

[project.scripts]
dagi = "dagi_core.cli:main"
"dagi-web" = "dagi_core.web:main"

[project.optional-dependencies]
dev = ["pytest==9.0.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["dagi_core*", "game*"]

[tool.setuptools.package-data]
dagi_core = ["static/*.html", "static/*.js"]
game = ["*.md", "*.json", "static/*.html", "static/*.js"]
